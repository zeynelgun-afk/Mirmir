[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Mirmir/Preview/MirmirPreview
EditorStartupMap=/Game/Mirmir/Preview/MirmirPreview
GlobalDefaultGameMode=/Script/Mirmir.MirmirGameMode

[/Script/Engine.RendererSettings]
; A modest baseline. Groom is optional and must be profiled on the target GPU.
r.DefaultFeature.MotionBlur=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.DefaultFeature.AutoExposure=False
; Skeletal Groom binding requires compute skin-cache shaders. This is enabled
; for the reviewed free cat; strand rendering remains opt-in per cat asset.
r.SkinCache.CompileShaders=True

[/Script/Engine.Engine]
bUseFixedFrameRate=False

[Audio]
; A desktop companion plays its quiet voice while another app has focus.
UnfocusedVolumeMultiplier=1.0

[SystemSettings]
; This small companion has no loading-screen prewarm requirement. Mesa ACO
; aborts on unused compute shaders compiled by Shipping's PSO prewarm pool on
; the target Radeon 890M. Compile only the pipelines actually used by the cat.
r.PSOPrecaching=0

[/Script/Engine.PhysicsSettings]
; Allow this project's small toy ball to rebound at gentle tabletop speeds.
BounceThresholdVelocity=20.0
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=16
